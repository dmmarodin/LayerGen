[package]
name = "layergen-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy_app = "0.20"
bevy_ecs = "0.20"
bevy_tasks = { version = "0.20", features = ["multi_threaded"] }

bevy = { version = "0.20", optional = true }
rayon = { version = "1.10", optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"

[features]
default = ["rayon"]
rayon = ["dep:rayon"]
serde = ["dep:serde"]
bevy-example = ["dep:bevy"]

[[bin]]
name = "layergen-example"
path = "src/main.rs"
required-features = ["bevy-example"]
