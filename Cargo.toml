[package]
name = "layergen-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy_app = "0.20"
bevy_ecs = "0.20"
bevy_tasks = { version = "0.20", features = ["multi_threaded"] }

rayon = { version = "1.10", optional = true }
serde = { version = "1", features = ["derive"], optional = true }

# Used by the consumer-side durable example, not the core storage API.
serde_json = { version = "1", optional = true }
tempfile = { version = "3", optional = true }
fs2 = { version = "0.4", optional = true }

[dev-dependencies]
serde_json = "1"

[features]
default = ["rayon"]
rayon = ["dep:rayon"]
serde = ["dep:serde"]
durable-example = [
    "serde",
    "dep:serde_json",
    "dep:tempfile",
    "dep:fs2",
]

[[example]]
name = "durable"
path = "examples/durable.rs"
required-features = ["durable-example"]
